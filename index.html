---
layout: default
title: ImproveBlog - Home
---

<h2>Blog Posts</h2>

{% for post in site.posts %}
  <article class="post">
    <div class="post-meta">
      Published on {{ post.date | date: "%B %d, %Y" }}
    </div>
    <h2 class="post-title">
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h2>
    <p class="post-excerpt">
      {{ post.excerpt }}
    </p>
    <a href="{{ post.url | relative_url }}" class="read-more">
      ബാക്കി വായിക്കുക
    </a>
  </article>
{% endfor %}
