---
layout: default
title: Archives
permalink: /archives/
---

<h2>Blog Archives</h2>

<ul class="archive-list">
  {% for post in site.posts %}
    <li>
      <span class="post-date">{{ post.date | date: "%B %d, %Y" }}</span> — 
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </li>
  {% endfor %}
</ul>
